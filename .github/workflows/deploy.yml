name: Monorepo CI/CD Deployment to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 0. DETECT CHANGED PATHS (Only deploy what actually changed)
  # ============================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for File Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - 'passenger_wsgi.py'
              - '.github/workflows/deploy.yml'

  # ============================================================================
  # 1. FRONTEND DEPLOYMENT (Static SPA Build -> cPanel Apache Web Folder)
  # ============================================================================
  deploy-frontend:
    name: Build & Deploy Frontend (SPA)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Configure Frontend Production .env
        working-directory: ./frontend
        run: |
          cat << 'EOF' > .env
          ${{ secrets.FRONTEND_PROD_ENV }}
          EOF
          cat << 'EOF' > .env.production
          ${{ secrets.FRONTEND_PROD_ENV }}
          EOF

      - name: Build Frontend Application (SPA Static Build)
        working-directory: ./frontend
        run: npm run build

      - name: Deploy Frontend to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/build/
          server-dir: ${{ secrets.CPANEL_FRONTEND_DIR || '/' }}
          dangerous-clean-slate: false

  # ============================================================================
  # 2. BACKEND DEPLOYMENT (FastAPI + Migrations via SSH/Tarball)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend & Run Migrations
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.CPANEL_SSH_PORT || 22 }} ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer Backend Files to cPanel via SSH
        run: |
          SSH_PORT="${{ secrets.CPANEL_SSH_PORT || 22 }}"
          SSH_USER="${{ secrets.CPANEL_SSH_USER }}"
          SSH_HOST="${{ secrets.CPANEL_SSH_HOST }}"
          APP_DIR="${{ secrets.CPANEL_BACKEND_DIR || '/home/enginee2/api-zenengr.synafeia.com' }}"

          echo "==> Transferring backend and passenger_wsgi.py to $APP_DIR via scp"
          scp -P "$SSH_PORT" -r backend passenger_wsgi.py "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Configure .env, Install Dependencies, Run Migrations & Restart
        run: |
          SSH_PORT="${{ secrets.CPANEL_SSH_PORT || 22 }}"
          SSH_USER="${{ secrets.CPANEL_SSH_USER }}"
          SSH_HOST="${{ secrets.CPANEL_SSH_HOST }}"
          APP_DIR="${{ secrets.CPANEL_BACKEND_DIR || '/home/enginee2/api-zenengr.synafeia.com' }}"

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            APP_DIR="/home/enginee2/api-zenengr.synafeia.com"
            echo "==> Configuring backend in $APP_DIR"
            cd "$APP_DIR"

            # 1. Inject Production Environment
            if [ -n "${{ secrets.BACKEND_PROD_ENV }}" ]; then
              echo "==> Writing backend/.env file"
              cat << 'ENVEOF' > backend/.env
          ${{ secrets.BACKEND_PROD_ENV }}
          ENVEOF
              chmod 600 backend/.env
            fi

            # 2. Use cPanel Python 3.12 Virtualenv binaries
            VENV_BIN="${{ secrets.CPANEL_VENV_BIN || '/home/enginee2/virtualenv/api-zenengr.synafeia.com/3.12/bin' }}"
            if [ -f "$VENV_BIN/activate" ]; then
              source "$VENV_BIN/activate"
            fi
            export PATH="$VENV_BIN:$PATH"

            # 3. Install dependencies & run Neon database migrations
            cd "$APP_DIR/backend"
            "$VENV_BIN/python" -m pip install -U pip setuptools wheel
            "$VENV_BIN/python" -m pip install -r requirements.txt
            "$VENV_BIN/alembic" upgrade head

            # 4. Trigger Phusion Passenger reload
            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"
            echo "==> Backend deployed & restarted successfully"
          EOF
