name: Monorepo CI/CD Deployment to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. FRONTEND DEPLOYMENT (SvelteKit Build -> cPanel Frontend Subdomain)
  # ============================================================================
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'frontend/') ||
      contains(github.event.head_commit.added, 'frontend/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Configure Frontend Production .env
        working-directory: ./frontend
        run: |
          if [ -n "${{ secrets.FRONTEND_PROD_ENV }}" ]; then
            cat << 'EOF' > .env
          ${{ secrets.FRONTEND_PROD_ENV }}
          EOF
          else
            cat << 'EOF' > .env
          PUBLIC_API_URL=${{ vars.FRONTEND_PUBLIC_API_URL || 'http://api-zenengr.synafeia.com/api/v1' }}
          PUBLIC_APP_NAME="ZenEngr"
          EOF
          fi

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Deploy Frontend to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/build/
          server-dir: ${{ secrets.CPANEL_FRONTEND_DIR || '/' }}
          dangerous-clean-slate: false

  # ============================================================================
  # 2. BACKEND DEPLOYMENT (Direct Sync via SSH -> cPanel Python App)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend & Run Migrations
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'backend/') ||
      contains(github.event.head_commit.added, 'backend/') ||
      contains(github.event.head_commit.modified, 'passenger_wsgi.py')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Backend Files to cPanel via SSH (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "backend,passenger_wsgi.py"
          target: "${{ secrets.CPANEL_BACKEND_DIR || '/home/enginee2/api-zenengr.synafeia.com' }}"
          overwrite: true

      - name: Configure .env, Install Dependencies & Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.CPANEL_BACKEND_DIR || '/home/enginee2/api-zenengr.synafeia.com' }}"
            echo "==> Configuring backend in $APP_DIR"
            cd "$APP_DIR"

            # 1. Inject Production Environment (from GitHub Secrets)
            if [ -n "${{ secrets.BACKEND_PROD_ENV }}" ]; then
              echo "==> Writing backend/.env file"
              cat << 'EOF' > backend/.env
            ${{ secrets.BACKEND_PROD_ENV }}
            EOF
              chmod 600 backend/.env
            fi

            # 2. Activate cPanel Python 3.12 Virtualenv
            if [ -f "/home/enginee2/virtualenv/api-zenengr.synafeia.com/3.12/bin/activate" ]; then
              source /home/enginee2/virtualenv/api-zenengr.synafeia.com/3.12/bin/activate
            elif [ -f ~/virtualenv/api-zenengr.synafeia.com/3.12/bin/activate ]; then
              source ~/virtualenv/api-zenengr.synafeia.com/3.12/bin/activate
            fi

            # 3. Install/sync backend dependencies & apply database migrations to Neon
            cd backend
            pip install -U pip setuptools wheel
            pip install -r requirements.txt
            alembic upgrade head

            # 4. Hot-reload cPanel Passenger
            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"
            echo "==> Backend deployed & restarted successfully"
