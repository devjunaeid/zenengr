<!doctype html>
<html lang="en" class="h-full bg-slate-50">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<style>
			/* Zero-latency initial boot splash */
			#app-boot-loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background-color: #f8fafc;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				z-index: 99999;
				pointer-events: none;
				transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.25s;
			}
			.boot-logo-box {
				width: 52px;
				height: 52px;
				border-radius: 14px;
				background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
				display: flex;
				align-items: center;
				justify-content: center;
				box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.35);
				animation: boot-logo-pulse 1.8s ease-in-out infinite;
			}
			.boot-logo-box svg {
				width: 28px;
				height: 28px;
			}
			.boot-progress-track {
				width: 130px;
				height: 3.5px;
				background-color: #e2e8f0;
				border-radius: 999px;
				margin-top: 24px;
				overflow: hidden;
				position: relative;
			}
			.boot-progress-bar {
				position: absolute;
				height: 100%;
				width: 45%;
				background: linear-gradient(90deg, #4f46e5, #818cf8);
				border-radius: 999px;
				animation: boot-bar-slide 1.3s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
			}
			.boot-loading-label {
				margin-top: 12px;
				font-size: 11.5px;
				font-weight: 600;
				color: #64748b;
				letter-spacing: 0.03em;
			}
			@keyframes boot-logo-pulse {
				0%, 100% { transform: scale(1); opacity: 1; }
				50% { transform: scale(1.04); opacity: 0.88; }
			}
			@keyframes boot-bar-slide {
				0% { left: -45%; width: 45%; }
				50% { left: 25%; width: 60%; }
				100% { left: 105%; width: 45%; }
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full antialiased bg-slate-50 text-slate-900">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Native Zero-Latency Boot Screen with Auto-Dismiss Failsafe -->
		<div id="app-boot-loader" aria-hidden="true">
			<div class="boot-logo-box">
				<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 2L2 7l10 5 10-5-10-5z"/>
					<path d="M2 17l10 5 10-5"/>
					<path d="M2 12l10 5 10-5"/>
				</svg>
			</div>
			<div class="boot-progress-track">
				<div class="boot-progress-bar"></div>
			</div>
			<span class="boot-loading-label">ZenEngr</span>
		</div>

		<script>
			// Dismiss boot loader smoothly once SvelteKit mounts the page content
			(function() {
				function dismissLoader() {
					const el = document.getElementById('app-boot-loader');
					if (el && el.style.opacity !== '0') {
						el.style.opacity = '0';
						el.style.visibility = 'hidden';
						setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 350);
					}
				}
				window.dismissBootLoader = dismissLoader;
				// Safety fallback ceiling only in case of complete script failure
				setTimeout(dismissLoader, 10000);
			})();
		</script>
	</body>
</html>
