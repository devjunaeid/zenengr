[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.0",
    "PyJWT>=2.0",
    "bcrypt>=4.0,<5.1",
    "redis>=5.0",
    "email-validator>=2.0",
    "reportlab>=5.0.0",
    "python-multipart>=0.0.32",
    "boto3>=1.43.64",
    "aiosmtplib>=5.1.2",
]

[project.scripts]
db-check = "scripts.db_check:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "alembic>=1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S608", "S105", "B008"]
"app/api/v1/*" = ["B008"]
"app/core/dependencies.py" = ["B008"]
"app/schemas/auth.py" = ["S105"]
"app/schemas/client_auth.py" = ["S105"]
"alembic/versions/*" = ["S608", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
disable_error_code = ["no-untyped-def", "no-untyped-call", "import-untyped"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:anyio"
markers = ["anyio: anyio plugin markers (inert; repo uses pytest-asyncio)"]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "moto>=5.2.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
